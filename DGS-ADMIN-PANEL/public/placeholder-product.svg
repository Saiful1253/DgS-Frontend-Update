<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>
  
  <!-- Outer Center Decorative Card -->
  <rect x="150" y="140" width="300" height="260" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" opacity="0.9" />
  
  <!-- Electronics Icon Graphics -->
  <g transform="translate(225, 185)">
    <!-- Monitor Screen -->
    <rect x="0" y="0" width="150" height="105" rx="10" fill="none" stroke="url(#iconGrad)" stroke-width="4" />
    <line x1="15" y1="80" x2="135" y2="80" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Monitor Stand -->
    <path d="M 60 105 L 55 125 L 95 125 L 90 105 Z" fill="url(#iconGrad)" opacity="0.7" />
    <rect x="40" y="125" width="70" height="6" rx="3" fill="url(#iconGrad)" />
    
    <!-- Pulse Line on Screen -->
    <path d="M 30 50 L 55 50 L 65 30 L 75 70 L 85 45 L 95 55 L 120 55" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Smartphone Overlay -->
    <g transform="translate(100, 45)">
      <rect x="0" y="0" width="45" height="75" rx="8" fill="#ffffff" stroke="url(#iconGrad)" stroke-width="3" />
      <line x1="15" y1="8" x2="30" y2="8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <circle cx="22.5" cy="65" r="3" fill="#cbd5e1" />
      <rect x="6" y="14" width="33" height="44" rx="3" fill="#f1f5f9" />
    </g>
  </g>
  
  <!-- Text Label -->
  <text x="300" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">NO IMAGE AVAILABLE</text>
  <text x="300" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">AUTHENTIC ELECTRONICS</text>
</svg>
